# Scheduler configuration reproducing the training regime of the runs behind
# the published models: the ten learning-rate steps are spread over the first
# 200k iterations and the last learning rate is then held for the remaining
# iterations, and validation runs every 334 rather than every 300 epochs.
lr_net:
  function: stepwise
  start: 5.0e-05
  stop: 5.0e-06
  steps: 10
lr_dec:
  function: stepwise
  start: 5.0e-05
  stop: 5.0e-06
  steps: 10
lr_pen:
  function: stepwise
  start: ${scheduler.lr_net.start}
  stop: ${scheduler.lr_net.stop}
  steps: 10
dt:
  function: stepwise
  start: 0.02
  stop: 0.02
  steps: 10
chkpt_every_epoch: 334
sched_stop_iter: 200000
